name: Red-team nightly

# Runs every attack and benign case against the demo app, without the gateway, with rules only,
# with rules and the classifier, and with the full gateway (the judge too when configured), and
# fails when a category's protected attack success rate rises beyond the tolerance in
# breakwater/redteam/targets.yaml (spec section 12). The run database is carried between
# nights in the Actions cache, so each run is compared with the previous one.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Classifier model cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: classifier-${{ hashFiles('breakwater/config.py') }}
      - name: Download the classifier model
        run: uv run breakwater classifier download
      - name: Restore previous runs
        uses: actions/cache/restore@v6
        with:
          path: redteam-history
          key: redteam-history-${{ github.run_id }}
          restore-keys: redteam-history-
      - name: Red-team run
        env:
          CLASSIFIER_ENABLED: "true"
          # The judge runs only when the repository sets the JUDGE_API_KEY secret and the
          # JUDGE_PROVIDER and JUDGE_MODEL variables.
          JUDGE_ENABLED: ${{ secrets.JUDGE_API_KEY != '' && vars.JUDGE_MODEL != '' && 'true' || 'false' }}
          JUDGE_PROVIDER: ${{ vars.JUDGE_PROVIDER }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
          JUDGE_API_KEY: ${{ secrets.JUDGE_API_KEY }}
        run: |
          mkdir -p redteam-history
          REDTEAM_DB="$PWD/redteam-history/runs.db" scripts/redteam_local.sh \
            --out reports --fail-on-regression --compare-layers
      - name: Save runs for the next comparison
        if: always()
        uses: actions/cache/save@v6
        with:
          path: redteam-history
          key: redteam-history-${{ github.run_id }}
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redteam-reports
          path: reports/

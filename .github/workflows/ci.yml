name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.7"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy gateway scripts tests demo_app sdk/python
      - name: Tests
        run: uv run pytest
      - name: Dependency audit
        run: uv run pip-audit --skip-editable
      - name: Detector evaluation (report only)
        run: uv run python scripts/eval_detectors.py --show-misses

  compose-smoke:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v7
      - name: Smoke test against Docker Compose
        run: scripts/smoke.sh

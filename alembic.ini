# Used for authoring migrations: `uv run alembic revision --autogenerate -m "..."`.
# The database URL comes from GATEWAY_DATABASE_URL (see gateway/storage/migrations/env.py).
# At runtime, apply migrations with `gateway db upgrade`.
[alembic]
script_location = gateway/storage/migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

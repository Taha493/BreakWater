# M1 services: gateway and Postgres. The mock upstream runs only with `--profile dev`.
# Later milestones add dashboard, demo_app, and qdrant (spec section 11).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_DB: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 2s
      timeout: 3s
      retries: 30

  gateway:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      GATEWAY_DATABASE_URL: postgresql://gateway:${POSTGRES_PASSWORD}@db:5432/gateway
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-http://mock_upstream:9000/v1}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:?set UPSTREAM_API_KEY in .env}
      GATEWAY_HASH_SECRET: ${GATEWAY_HASH_SECRET:?set GATEWAY_HASH_SECRET in .env}
      ADMIN_BOOTSTRAP_KEY: ${ADMIN_BOOTSTRAP_KEY:-}
      STORE_FULL_TEXT: ${STORE_FULL_TEXT:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  mock_upstream:
    profiles: [dev]
    build: .
    command: ["uvicorn", "scripts.mock_upstream:app", "--host", "0.0.0.0", "--port", "9000"]

volumes:
  pgdata:

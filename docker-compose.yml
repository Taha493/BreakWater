# Services: gateway, Postgres, and the dashboard by default. `--profile dev` adds the mock
# upstream; `--profile demo` adds the deliberately vulnerable demo RAG app and its Qdrant
# store (never expose the demo app beyond localhost).
# The project name fixes the container and volume names whatever folder the repo is in.
name: breakwater

services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: gateway
      POSTGRES_DB: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Fetches the classifier model into the models volume before the gateway starts (only
  # when CLASSIFIER_ENABLED=true; about 740 MB the first time, nothing after that).
  classifier_model:
    build: .
    command: ["sh", "-c", "if [ \"$$CLASSIFIER_ENABLED\" = true ]; then breakwater classifier download; fi"]
    environment:
      CLASSIFIER_ENABLED: ${CLASSIFIER_ENABLED:-false}
    volumes:
      - models:/models
    restart: "no"

  gateway:
    build: .
    depends_on:
      db:
        condition: service_healthy
      classifier_model:
        condition: service_completed_successfully
    environment:
      GATEWAY_DATABASE_URL: postgresql://gateway:${POSTGRES_PASSWORD}@db:5432/gateway
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-http://mock_upstream:9000/v1}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:?set UPSTREAM_API_KEY in .env}
      GATEWAY_HASH_SECRET: ${GATEWAY_HASH_SECRET:?set GATEWAY_HASH_SECRET in .env}
      ADMIN_BOOTSTRAP_KEY: ${ADMIN_BOOTSTRAP_KEY:-}
      STORE_FULL_TEXT: ${STORE_FULL_TEXT:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Red-team targets (breakwater/redteam/targets.yaml) as seen from inside this container.
      REDTEAM_DEMO_URL: ${REDTEAM_DEMO_URL:-http://demo_app:8100}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # Layer 2: classifier_model fetches the model into the models volume first.
      CLASSIFIER_ENABLED: ${CLASSIFIER_ENABLED:-false}
      CLASSIFIER_THREADS: ${CLASSIFIER_THREADS:-2}
      # Layer 3: off unless a provider and model are set (see .env.example).
      JUDGE_ENABLED: ${JUDGE_ENABLED:-false}
      JUDGE_PROVIDER: ${JUDGE_PROVIDER:-}
      JUDGE_MODEL: ${JUDGE_MODEL:-}
      JUDGE_API_KEY: ${JUDGE_API_KEY:-}
      JUDGE_BASE_URL: ${JUDGE_BASE_URL:-}
      JUDGE_EFFORT: ${JUDGE_EFFORT:-}
      JUDGE_JSON_MODE: ${JUDGE_JSON_MODE:-json_schema}
    volumes:
      - models:/models
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      # Loading the classifier from the models volume takes a while on a small CPU.
      start_period: 120s

  dashboard:
    build:
      context: dashboard
      args:
        VITE_GATEWAY_URL: ${DASHBOARD_GATEWAY_URL:-http://localhost:8000}
    environment:
      GATEWAY_ORIGIN: ${DASHBOARD_GATEWAY_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:8080:8080"

  mock_upstream:
    profiles: [dev]
    build: .
    command: ["uvicorn", "scripts.mock_upstream:app", "--host", "0.0.0.0", "--port", "9000"]

  qdrant:
    profiles: [demo]
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    volumes:
      - qdrant:/qdrant/storage

  demo_app:
    profiles: [demo]
    build:
      context: .
      args:
        UV_GROUPS: "--group demo"
    command: ["uvicorn", "demo_app.vulnerable_rag:app", "--host", "0.0.0.0", "--port", "8100"]
    depends_on:
      gateway:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      DEMO_GATEWAY_URL: http://gateway:8000
      DEMO_GATEWAY_KEY: ${DEMO_GATEWAY_KEY:-}
      DEMO_UPSTREAM_BASE_URL: ${DEMO_UPSTREAM_BASE_URL:-http://mock_upstream:9000/v1}
      DEMO_UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:?set UPSTREAM_API_KEY in .env}
      DEMO_QDRANT_URL: http://qdrant:6333
      DEMO_MODEL: ${DEMO_MODEL:-sim-obedient}
    ports:
      - "127.0.0.1:8100:8100"

volumes:
  pgdata:
  qdrant:
  models:

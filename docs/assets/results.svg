<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" width="1280" height="430" role="img" aria-labelledby="title desc">
<title id="title">Attack success rate per configuration</title>
<desc id="desc">Bar chart of the share of 75 attacks (two variants each) that succeed. Without Breakwater 98%; rules only 44% with 0% false positives and 22 ms added at p50; rules plus the LLM judge 22.7% with 0% false positives; rules plus the classifier 1.3% with 7% false positives and 143 ms added at p50.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#060e1a"/><stop offset="1" stop-color="#0b2034"/></linearGradient>
<clipPath id="frame"><rect width="1280" height="430" rx="22"/></clipPath>
</defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes fade{from{opacity:0}to{opacity:1}}.bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}.val{animation:fade .6s both}</style>
<g clip-path="url(#frame)">
<rect width="1280" height="430" fill="url(#bg)"/>
<text x="64" y="58" font-size="22" font-weight="700" fill="#eaf3ff">Attacks that still succeed <tspan font-weight="400" fill="#5f7d99">(lower is better)</tspan></text>
<text x="64" y="84" font-size="13.5" fill="#5f7d99">75 attacks × 2 variants · Breakwater's own red-team harness · seed 1 · simulated model that obeys any injected instruction</text>
<text x="1060" y="120" font-size="12" fill="#5f7d99" text-anchor="middle">false positives</text>
<text x="1176" y="120" font-size="12" fill="#5f7d99" text-anchor="middle">added p50</text>
<line x1="330.0" y1="128" x2="330.0" y2="380" stroke="#1c3550"/><text x="330.0" y="120" font-size="12" fill="#5f7d99" text-anchor="middle">0%</text><line x1="487.5" y1="128" x2="487.5" y2="380" stroke="#1c3550"/><text x="487.5" y="120" font-size="12" fill="#5f7d99" text-anchor="middle">25%</text><line x1="645.0" y1="128" x2="645.0" y2="380" stroke="#1c3550"/><text x="645.0" y="120" font-size="12" fill="#5f7d99" text-anchor="middle">50%</text><line x1="802.5" y1="128" x2="802.5" y2="380" stroke="#1c3550"/><text x="802.5" y="120" font-size="12" fill="#5f7d99" text-anchor="middle">75%</text><line x1="960.0" y1="128" x2="960.0" y2="380" stroke="#1c3550"/><text x="960.0" y="120" font-size="12" fill="#5f7d99" text-anchor="middle">100%</text><text x="64" y="156" font-size="17" font-weight="700" fill="#eaf3ff">Without Breakwater</text><text x="64" y="176" font-size="13" fill="#5f7d99">the model alone</text><rect class="bar" style="animation-delay:0.25s" x="330" y="137" width="617.4" height="28" rx="4" fill="#e8693a"/><text class="val" style="animation-delay:1.15s" x="957.4" y="157" font-size="17" font-weight="700" fill="#eaf3ff">98%</text><text x="1060" y="157" font-size="16" fill="#a9c1da" text-anchor="middle">–</text><text x="1176" y="157" font-size="16" fill="#a9c1da" text-anchor="middle">–</text><text x="64" y="218" font-size="17" font-weight="700" fill="#eaf3ff">Rules only</text><text x="64" y="238" font-size="13" fill="#5f7d99">layer 1, always on</text><rect class="bar" style="animation-delay:0.47s" x="330" y="199" width="277.2" height="28" rx="4" fill="#3f8fe8"/><text class="val" style="animation-delay:1.37s" x="617.2" y="219" font-size="17" font-weight="700" fill="#eaf3ff">44%</text><text x="1060" y="219" font-size="16" fill="#a9c1da" text-anchor="middle">0%</text><text x="1176" y="219" font-size="16" fill="#a9c1da" text-anchor="middle">22 ms</text><text x="64" y="280" font-size="17" font-weight="700" fill="#eaf3ff">Rules + LLM judge</text><text x="64" y="300" font-size="13" fill="#5f7d99">judge on borderline text</text><rect class="bar" style="animation-delay:0.69s" x="330" y="261" width="143.0" height="28" rx="4" fill="#3f8fe8"/><text class="val" style="animation-delay:1.59s" x="483.0" y="281" font-size="17" font-weight="700" fill="#eaf3ff">22.7%</text><text x="1060" y="281" font-size="16" fill="#a9c1da" text-anchor="middle">0%</text><text x="1176" y="281" font-size="16" fill="#a9c1da" text-anchor="middle">31 ms*</text><text x="64" y="342" font-size="17" font-weight="700" fill="#eaf3ff">Rules + classifier</text><text x="64" y="362" font-size="13" fill="#5f7d99">layer 2, DeBERTa ONNX</text><rect class="bar" style="animation-delay:0.91s" x="330" y="323" width="8.2" height="28" rx="4" fill="#3f8fe8"/><text class="val" style="animation-delay:1.81s" x="348.2" y="343" font-size="17" font-weight="700" fill="#eaf3ff">1.3%</text><text x="1060" y="343" font-size="16" fill="#a9c1da" text-anchor="middle">7%</text><text x="1176" y="343" font-size="16" fill="#a9c1da" text-anchor="middle">143 ms</text>
<text x="64" y="404" font-size="12" fill="#5f7d99">False positives: 100 benign prompts and documents. * 31 ms when the judge is not called; about 860 ms when it is.</text>
</g>
</svg>

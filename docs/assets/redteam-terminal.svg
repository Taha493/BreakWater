<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 456" width="1280" height="456" role="img" aria-labelledby="title desc">
<title id="title">A Breakwater red-team run</title>
<desc id="desc">Animated terminal. The command breakwater redteam run --target demo_rag_judge --compare-layers --limit 5 is typed, then its output appears: attack success rate per category without protection, with rules only, and with the full gateway. All categories: 100% unprotected, 25% with rules only, 10% protected; false positive rate 0%.</desc>

[project]
name = "aisg-client"
version = "0.1.0"
description = "Python client for the AI Security Gateway: scan helpers and a guarded_tool decorator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aisg_client"]

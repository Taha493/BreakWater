# Secret formats for the leak_secrets detector (layer 1), also used to redact excerpts.
#
# RE2 syntax. ``kind`` is informational; placeholders use the rule id. Formats are the
# publicly documented token prefixes of common providers. Every rule needs at least two
# positive and two negative examples in tests/unit/rule_cases.yaml.
rules:
  - id: secret-private-key
    description: Private key block
    attack_class: A3
    severity: critical
    score: 1.0
    case_sensitive: true
    kind: private_key
    pattern: '(?s)-----BEGIN [A-Z ]{0,40}PRIVATE KEY-----.*?(?:-----END [A-Z ]{0,40}PRIVATE KEY-----|\z)'

  - id: secret-jwt
    description: JSON Web Token
    attack_class: A3
    severity: high
    score: 0.9
    case_sensitive: true
    kind: jwt
    pattern: '\beyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'

  - id: secret-gateway-key
    description: Breakwater API key
    attack_class: A3
    severity: critical
    score: 1.0
    case_sensitive: true
    kind: gateway_key
    pattern: '\bgw\.[0-9a-f]{16}\.[A-Za-z0-9_-]{32,}'

  - id: secret-aws-access-key
    description: AWS access key id
    attack_class: A3
    severity: critical
    score: 0.95
    case_sensitive: true
    kind: aws_access_key
    pattern: '\b(?:AKIA|ASIA|ABIA|ACCA)[0-9A-Z]{16}\b'

  - id: secret-api-key
    description: API key with an sk- prefix (OpenAI, Anthropic, and similar)
    attack_class: A3
    severity: critical
    score: 0.95
    case_sensitive: true
    kind: api_key
    pattern: '\bsk-[A-Za-z0-9_-]{20,}'

  - id: secret-stripe-key
    description: Stripe live secret or restricted key
    attack_class: A3
    severity: critical
    score: 0.95
    case_sensitive: true
    kind: stripe_key
    pattern: '\b(?:sk|rk)_live_[A-Za-z0-9]{16,}'

  - id: secret-github-token
    description: GitHub token
    attack_class: A3
    severity: critical
    score: 0.95
    case_sensitive: true
    kind: github_token
    pattern: '\b(?:gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{22,})'

  - id: secret-gitlab-token
    description: GitLab personal access token
    attack_class: A3
    severity: critical
    score: 0.95
    case_sensitive: true
    kind: gitlab_token
    pattern: '\bglpat-[A-Za-z0-9_-]{20,}'

  - id: secret-slack-token
    description: Slack token
    attack_class: A3
    severity: critical
    score: 0.95
    case_sensitive: true
    kind: slack_token
    pattern: '\bxox[abprs]-[A-Za-z0-9-]{10,}'

  - id: secret-google-api-key
    description: Google API key
    attack_class: A3
    severity: high
    score: 0.9
    case_sensitive: true
    kind: google_api_key
    pattern: '\bAIza[0-9A-Za-z_-]{35}'

  - id: secret-bearer-token
    description: Bearer token in an authorization value
    attack_class: A3
    severity: high
    score: 0.85
    kind: bearer_token
    pattern: '\bbearer\s+[A-Za-z0-9._~+/-]{20,}=*'

  - id: secret-url-credentials
    description: Password embedded in a connection URL
    attack_class: A3
    severity: high
    score: 0.9
    kind: url_credentials
    pattern: '\b[a-z][a-z0-9+.-]{1,20}://[^\s:/@]{1,64}:[^\s:/@]{3,128}@[^\s/]{1,255}'

  - id: secret-credential-assignment
    description: Password, secret, or token assigned a value
    attack_class: A3
    severity: high
    score: 0.85
    kind: credential
    # The value must end at whitespace, a quote, a separator, or end of line, so code such
    # as `password = get_password()` or `os.environ[...]` does not match.
    pattern: '(?m)(?:\b|_)(?:api[_-]?key|secret[_-]?key|client[_-]?secret|password|passwd|access[_-]?token|auth[_-]?token)["'']?\s*[:=]\s*["'']?[^\s"'',;()\[\]{}<>]{8,}(?:[\s"'',;]|$)'
